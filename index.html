<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<title>Melis'in İngilizce Kelime Kartları</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-title">
    <span class="logo">🦉</span>
    <span>Melis'in Kelime Kartları</span>
  </div>
  <div class="topbar-actions">
    <button type="button" data-action="backup:export" title="Yedek indir (JSON)">⬇️</button>
    <label class="icon-btn" title="Yedekten geri yükle">
      ⬆️
      <input type="file" accept="application/json" data-action="backup:import" hidden>
    </label>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<nav class="bottom-nav">
  <button type="button" data-action="nav:home" data-tab="home">
    <span class="nav-icon">🏠</span><span>Ana Sayfa</span>
  </button>
  <button type="button" data-action="nav:weeks" data-tab="weeks">
    <span class="nav-icon">📅</span><span>Haftalar</span>
  </button>
  <button type="button" data-action="nav:cards" data-tab="cards">
    <span class="nav-icon">🃏</span><span>Kartlar</span>
  </button>
  <button type="button" data-action="nav:quiz" data-tab="quiz">
    <span class="nav-icon">📝</span><span>Sınav</span>
  </button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
